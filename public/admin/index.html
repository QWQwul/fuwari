<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#f7f2e6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#12100c" media="(prefers-color-scheme: dark)" />
    <title>内容后台 · QWQ</title>
    <link rel="icon" href="/favicon/favicon-light-192.png" />
    <style>
      :root { color-scheme: light dark; --splash-bg: #f7f2e6; --splash-fg: #6f6a5c; }
      @media (prefers-color-scheme: dark) {
        :root { --splash-bg: #12100c; --splash-fg: #a9a294; }
      }
      html, body { margin: 0; background: var(--splash-bg); }
      #admin-splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 16px; background: var(--splash-bg); color: var(--splash-fg);
        font: 14px/1.6 Roboto, "Noto Sans SC", system-ui, sans-serif;
        transition: opacity .35s ease;
      }
      #admin-splash img {
        width: 72px; height: 72px; border-radius: 20px; background: #fff;
        padding: 12px; box-sizing: border-box;
        box-shadow: 0 14px 34px -20px rgba(90, 74, 34, .5);
        animation: float 2.4s ease-in-out infinite;
      }
      #admin-splash.is-hidden { opacity: 0; pointer-events: none; }
      @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
      @media (prefers-reduced-motion: reduce) { #admin-splash img { animation: none } }
      #sso-bar {
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 9998;
        display: flex; flex-direction: column; gap: 10px; align-items: stretch;
        padding: 16px 18px calc(16px + env(safe-area-inset-bottom));
        background: var(--splash-bg); border-top: 1px solid rgba(140, 120, 80, .25);
        color: var(--splash-fg); font: 14px/1.5 Roboto, "Noto Sans SC", system-ui, sans-serif;
      }
      #sso-bar p { margin: 0; text-align: center; }
      #sso-bar button {
        height: 46px; border: 0; border-radius: 999px; font-size: 15px; font-weight: 600;
        background: oklch(0.70 0.14 60); color: #201a10;
      }
    </style>
  </head>
  <body>
    <div id="admin-splash" role="status" aria-live="polite">
      <img src="/favicon/favicon-light-192.png" alt="" />
      <p>正在加载内容后台…</p>
    </div>
    <script src="/vendor/sveltia-cms.js"></script>
    <script>
      (function () {
        var splash = document.getElementById("admin-splash");
        var ticks = 0;
        var timer = setInterval(function () {
          var mounted = !!document.querySelector("body > div:not(#admin-splash)");
          if (mounted) {
            clearInterval(timer);
            splash.classList.add("is-hidden");
            setTimeout(function () { splash.remove(); }, 400);
          } else if (++ticks > 240) {
            clearInterval(timer);
            splash.innerHTML = "<p>后台加载失败，请检查网络后刷新重试。</p>";
          }
        }, 200);

        // 手机批准后带 ?sso=1 回来：给一个按钮（必须有真实点击，浏览器才允许弹窗）
        if (/[?&]sso=1/.test(location.search)) {
          var bar = document.createElement("div");
          bar.id = "sso-bar";
          bar.innerHTML =
            '<p>手机已批准，点一下继续进入后台</p><button type="button">继续进入后台</button>';
          document.body.appendChild(bar);
          var go = function () {
            var btns = document.querySelectorAll("button, a");
            for (var i = 0; i < btns.length; i++) {
              var el = btns[i];
              var txt = (el.textContent || "").trim();
              if (/登录|登入|sign\s*in|log\s*in/i.test(txt) && !el.disabled) {
                el.click();
                if (bar && bar.parentNode) bar.remove();
                return true;
              }
            }
            return false;
          };
          bar.querySelector("button").addEventListener("click", go);
        }
      })();
    </script>
  </body>
</html>
