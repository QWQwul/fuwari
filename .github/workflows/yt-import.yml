name: Import YouTube Video

# 手动触发：Actions 页面点 Run workflow，填视频地址和保存的文件名。
# 用途：YouTube 对 Cloudflare 出口做机器人校验，中转站拿不到流；
# 让 GitHub 的机器去下载，再推到自建视频托管 video.qwqads.dpdns.org，站内就能直接播。

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'YouTube 视频地址（例如 https://www.youtube.com/watch?v=dQw4w9WgXcQ）'
        required: true
        type: string
      name:
        description: '保存的文件名（不含扩展名，留空则用视频 id）'
        required: false
        type: string
      quality:
        description: '画质上限'
        required: false
        default: '720'
        type: choice
        options: ['480', '720', '1080']

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install yt-dlp
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade yt-dlp
          yt-dlp --version

      - name: Install ffmpeg
        # 分轨视频（1080p 以上都是音视频分离）需要 ffmpeg 合并，runner 上默认没有。
        # 不直接用 apt：apt-get update 偶发卡死（会一直挂着把整个任务拖到超时），
        # 改用 imageio-ffmpeg 附带的静态二进制，纯 pip 下载，快且不会卡。
        run: |
          python -m pip install --upgrade imageio-ffmpeg
          FF=$(python -c "import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())")
          echo "ffmpeg 路径: $FF"
          echo "FFMPEG_BIN=$FF" >> "$GITHUB_ENV"
          "$FF" -version | head -1

      - name: Download video
        id: dl
        env:
          URL: ${{ inputs.url }}
          NAME: ${{ inputs.name }}
          QUALITY: ${{ inputs.quality }}
        run: |
          set -euo pipefail
          vid=$(python - <<'PY'
          import os, re, urllib.parse as u
          s = os.environ["URL"].strip()
          p = u.urlparse(s)
          if p.hostname and "youtu.be" in p.hostname:
              print(p.path.strip("/").split("/")[0]); raise SystemExit
          q = u.parse_qs(p.query)
          if "v" in q:
              print(q["v"][0]); raise SystemExit
          m = re.search(r"/(embed|shorts|v)/([A-Za-z0-9_-]{3,40})", p.path)
          print(m.group(2) if m else "")
          PY
          )
          if [ -z "$vid" ]; then echo "::error::无法从地址里解析出视频 id"; exit 1; fi
          out="${NAME:-$vid}"
          echo "vid=$vid" >> "$GITHUB_OUTPUT"
          echo "out=$out" >> "$GITHUB_OUTPUT"
          echo "视频 id: $vid，保存名: $out"

          # 实测：默认客户端（visionos/web_safari 轮换）能拿到流；android_vr 反而 403。
          # 所以先用默认，失败再试 android_vr，最后试一次不分画质上限的。
          # yt-dlp 找的是 PATH 里的 ffmpeg，这里临时指给 pip 装的那个静态二进制。
          mkdir -p /tmp/ffbin
          ln -sf "${FFMPEG_BIN}" /tmp/ffbin/ffmpeg
          export PATH="/tmp/ffbin:$PATH"
          ffmpeg -version | head -1
          fmt="bv*[height<=${QUALITY}][ext=mp4]+ba[ext=m4a]/b[height<=${QUALITY}][ext=mp4]/b[height<=${QUALITY}]/b"
          ok=0
          yt-dlp -f "$fmt" --merge-output-format mp4 --no-playlist \
            -o "/tmp/${out}.mp4" "$URL" && ok=1 || echo "::warning::默认客户端失败，试 android_vr"
          if [ "$ok" = "0" ]; then
            yt-dlp -f "$fmt" --merge-output-format mp4 --no-playlist \
              --extractor-args "youtube:player_client=android_vr,web_safari,web" \
              -o "/tmp/${out}.mp4" "$URL" && ok=1 || echo "::warning::android_vr 也失败，去掉画质上限重试"
          fi
          if [ "$ok" = "0" ]; then
            yt-dlp -f "b/bv*+ba" --merge-output-format mp4 --no-playlist \
              -o "/tmp/${out}.mp4" "$URL" && ok=1 || true
          fi
          if [ "$ok" = "0" ]; then echo "::error::三种客户端都下载失败"; exit 1; fi
          ls -lh "/tmp/${out}.mp4"
          echo "size=$(stat -c%s "/tmp/${out}.mp4")" >> "$GITHUB_OUTPUT"

      - name: Upload to video host
        env:
          TOKEN: ${{ secrets.VIDEO_UPLOAD_TOKEN }}
          OUT: ${{ steps.dl.outputs.out }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::缺少仓库 Secret VIDEO_UPLOAD_TOKEN（视频托管的 UPLOAD_TOKEN）"
            exit 1
          fi
          # 文件名可能是中文：必须 percent-encode 再拼进 URL，
          # 直接塞原始 UTF-8 字节会让 Cloudflare 边缘直接回 400
          qname=$(python -c "import os,urllib.parse;print(urllib.parse.quote(os.environ['OUT']+'.mp4'))")
          echo "上传名（已编码）: $qname"
          code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' \
            -X POST "https://video.qwqads.dpdns.org/upload?name=${qname}" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "content-type: video/mp4" \
            --data-binary "@/tmp/${OUT}.mp4")
          echo "HTTP $code"
          cat /tmp/resp.json || true
          echo
          if [ "$code" != "200" ]; then echo "::error::上传失败"; exit 1; fi
          url=$(python -c "import json;print(json.load(open('/tmp/resp.json')).get('url',''))")
          echo "### 转存完成喵" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "视频地址：$url" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "在文章里这样写：" >> "$GITHUB_STEP_SUMMARY"
          echo '```html' >> "$GITHUB_STEP_SUMMARY"
          echo "<video src=\"$url\" controls></video>" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
