backend:
  name: github
  repo: QWQwul/fuwari
  branch: main
  base_url: https://ai.qwqads.dpdns.org
  auth_endpoint: auth
  api_root: https://ai.qwqads.dpdns.org/gw
  commit_messages:
    create: "docs: 新增文章「{{slug}}」"
    update: "docs: 更新文章「{{slug}}」"
    delete: "docs: 删除文章「{{slug}}」"
    uploadMedia: "chore: 上传图片 {{path}}"
    deleteMedia: "chore: 删除图片 {{path}}"

site_url: https://ai.qwqads.dpdns.org
display_url: https://ai.qwqads.dpdns.org
logo_url: https://ai.qwqads.dpdns.org/favicon/favicon-light-192.png

# 关掉「部署状态」轮询：后台不再每 5 秒去查 Cloudflare Pages 构建状态，
# 保存后立即结束，避免一直停在 Saving… 喵
show_preview_links: false

media_folder: public/uploads
public_folder: /uploads

collections:
  - name: posts
    label: 文章
    label_singular: 文章
    folder: src/content/posts
    create: true
    delete: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    identifier_field: title
    # 允许读取子目录里的文章（比如 guide/index.md），但不在界面上显示文件夹喵
    nested:
      depth: 2
      subfolders: false
    summary: "{{title}} · {{published}}"
    sortable_fields: [published, title]
    fields:
      - label: 标题
        name: title
        widget: string
      - label: 摘要
        name: description
        widget: text
        required: false
        hint: 首页卡片上显示的一两句话
      - label: 发布日期
        name: published
        widget: datetime
        format: YYYY-MM-DD
        date_format: YYYY-MM-DD
        time_format: false
        picker_utc: true
      - label: 更新日期
        name: updated
        widget: datetime
        required: false
        format: YYYY-MM-DD
        date_format: YYYY-MM-DD
        time_format: false
      - label: 封面
        name: image
        widget: image
        required: false
        hint: 上传后的路径是 /uploads/xxx，直接保存即可
      - label: 标签
        name: tags
        widget: list
        required: false
        default: []
      - label: 分类
        name: category
        widget: string
        required: false
        default: 杂谈
      - label: 草稿
        name: draft
        widget: boolean
        default: false
      - label: 置顶
        name: pinned
        widget: boolean
        default: false
      - label: 正文
        name: body
        widget: markdown

  - name: pages
    label: 关于页
    files:
      - label: 关于
        name: about
        file: src/content/spec/about.md
        fields:
          - label: 正文
            name: body
            widget: markdown
