name: Import YouTube Video

# 手动触发：Actions 页面点 Run workflow，填视频地址和保存的文件名。
# 用途：YouTube 对 Cloudflare 出口做机器人校验，中转站拿不到流；
# 让 GitHub 的机器去下载，再推到自建视频托管 video.qwqads.dpdns.org，站内就能直接播。

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'YouTube 视频地址（例如 https://www.youtube.com/watch?v=dQw4w9WgXcQ）'
        required: true
        type: string
      name:
        description: '保存的文件名（不含扩展名，留空则用视频 id）'
        required: false
        type: string
      quality:
        description: '画质上限'
        required: false
        default: '720'
        type: choice
        options: ['480', '720', '1080']

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install yt-dlp
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade yt-dlp
          yt-dlp --version

      - name: Download video
        id: dl
        env:
          URL: ${{ inputs.url }}
          NAME: ${{ inputs.name }}
          QUALITY: ${{ inputs.quality }}
        run: |
          set -euo pipefail
          vid=$(python - <<'PY'
          import os, re, urllib.parse as u
          s = os.environ["URL"].strip()
          p = u.urlparse(s)
          if p.hostname and "youtu.be" in p.hostname:
              print(p.path.strip("/").split("/")[0]); raise SystemExit
          q = u.parse_qs(p.query)
          if "v" in q:
              print(q["v"][0]); raise SystemExit
          m = re.search(r"/(embed|shorts|v)/([A-Za-z0-9_-]{3,40})", p.path)
          print(m.group(2) if m else "")
          PY
          )
          if [ -z "$vid" ]; then echo "::error::无法从地址里解析出视频 id"; exit 1; fi
          out="${NAME:-$vid}"
          echo "vid=$vid" >> "$GITHUB_OUTPUT"
          echo "out=$out" >> "$GITHUB_OUTPUT"
          echo "视频 id: $vid，保存名: $out"

          # android_vr 客户端在部分网络下更容易拿到流；失败再退回默认
          fmt="bv*[height<=${QUALITY}][ext=mp4]+ba[ext=m4a]/b[height<=${QUALITY}][ext=mp4]/b[height<=${QUALITY}]/b"
          if ! yt-dlp -f "$fmt" --merge-output-format mp4 \
               --extractor-args "youtube:player_client=android_vr,web_safari,web" \
               --no-playlist --no-warnings -o "/tmp/${out}.mp4" "$URL"; then
            echo "::warning::android_vr 客户端失败，退回默认客户端重试"
            yt-dlp -f "$fmt" --merge-output-format mp4 \
               --no-playlist -o "/tmp/${out}.mp4" "$URL"
          fi
          ls -lh "/tmp/${out}.mp4"
          echo "size=$(stat -c%s "/tmp/${out}.mp4")" >> "$GITHUB_OUTPUT"

      - name: Upload to video host
        env:
          TOKEN: ${{ secrets.VIDEO_UPLOAD_TOKEN }}
          OUT: ${{ steps.dl.outputs.out }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::缺少仓库 Secret VIDEO_UPLOAD_TOKEN（视频托管的 UPLOAD_TOKEN）"
            exit 1
          fi
          code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' \
            -X POST "https://video.qwqads.dpdns.org/upload?name=${OUT}.mp4" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "content-type: video/mp4" \
            --data-binary "@/tmp/${OUT}.mp4")
          echo "HTTP $code"
          cat /tmp/resp.json || true
          echo
          if [ "$code" != "200" ]; then echo "::error::上传失败"; exit 1; fi
          url=$(python -c "import json;print(json.load(open('/tmp/resp.json')).get('url',''))")
          echo "### 转存完成喵" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "视频地址：$url" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "在文章里这样写：" >> "$GITHUB_STEP_SUMMARY"
          echo '```html' >> "$GITHUB_STEP_SUMMARY"
          echo "<video src=\"$url\" controls></video>" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
